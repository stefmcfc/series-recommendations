name: CI

on:
  push:
    branches: [main]
  pull_request:

# Cancel a PR's in-progress run when a new commit supersedes it (e.g. a quick fixup
# pushed while the previous run is still going). Runs on main are never cancelled --
# a push to main should always run to completion.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  # Computes three outputs so backend/frontend only run when there's something of
  # theirs to check -- see the step below for why this can't be plain path-matching.
  changes:
    runs-on: ubuntu-latest
    outputs:
      release_cut_only: ${{ steps.detect.outputs.release_cut_only }}
      backend: ${{ steps.detect.outputs.backend }}
      frontend: ${{ steps.detect.outputs.frontend }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Detect what changed
        id: detect
        # Plain path-matching can't be used for backend/frontend here: almost every
        # merge bumps backend/build.gradle.kts's and frontend/package.json's version
        # line together as part of the release cut (CLAUDE.md's "Versioning &
        # changelog" section), even for a frontend-only or backend-only feature. A
        # naive "did anything under backend/** change" check would see that version
        # bump and wrongly call it a backend change on every single merge. So a
        # version-line-only diff to those two files doesn't count on its own -- only
        # an additional real change elsewhere under backend/**/frontend/** does. When
        # nothing else changed at all beyond CHANGELOG.md + those two version lines,
        # `release_cut_only` also fires, matching a standalone release-cut commit
        # (e.g. 385859e). Editing this workflow file always runs both.
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            BASE="${{ github.event.pull_request.base.sha }}"
            HEAD="${{ github.event.pull_request.head.sha }}"
          else
            BASE="${{ github.event.before }}"
            HEAD="${{ github.sha }}"
          fi

          backend=true
          frontend=true
          release_cut_only=false

          if [ -n "$BASE" ] && [ "$BASE" != "0000000000000000000000000000000000000000" ]; then
            files=$(git diff --name-only "$BASE" "$HEAD")

            gradle_beyond_version=false
            if echo "$files" | grep -qx "backend/build.gradle.kts" \
               && git diff "$BASE" "$HEAD" -- backend/build.gradle.kts \
                  | grep -E '^[+-]' | grep -vE '^(\+\+\+|---)' | grep -qvE '^[+-]version = "[0-9.]+"$'; then
              gradle_beyond_version=true
            fi

            package_json_beyond_version=false
            if echo "$files" | grep -qx "frontend/package.json" \
               && git diff "$BASE" "$HEAD" -- frontend/package.json \
                  | grep -E '^[+-]' | grep -vE '^(\+\+\+|---)' | grep -qvE '^[+-]  "version": "[0-9.]+",?$'; then
              package_json_beyond_version=true
            fi

            workflow_changed=false
            echo "$files" | grep -qx ".github/workflows/ci.yml" && workflow_changed=true

            other_backend=$(echo "$files" | grep -E '^backend/' | grep -vx 'backend/build.gradle.kts' || true)
            other_frontend=$(echo "$files" | grep -E '^frontend/' | grep -vx 'frontend/package.json' || true)

            if [ -n "$other_backend" ] || [ "$gradle_beyond_version" = true ] || [ "$workflow_changed" = true ]; then
              backend=true
            else
              backend=false
            fi

            if [ -n "$other_frontend" ] || [ "$package_json_beyond_version" = true ] || [ "$workflow_changed" = true ]; then
              frontend=true
            else
              frontend=false
            fi

            allowed=$'CHANGELOG.md\nbackend/build.gradle.kts\nfrontend/package.json'
            if [ -n "$files" ] && [ -z "$(comm -23 <(echo "$files" | sort) <(echo "$allowed" | sort))" ] \
               && [ "$gradle_beyond_version" = false ] && [ "$package_json_beyond_version" = false ]; then
              release_cut_only=true
            fi
          fi

          echo "Changed files: $files"
          echo "backend=$backend frontend=$frontend release_cut_only=$release_cut_only"
          echo "backend=$backend" >> "$GITHUB_OUTPUT"
          echo "frontend=$frontend" >> "$GITHUB_OUTPUT"
          echo "release_cut_only=$release_cut_only" >> "$GITHUB_OUTPUT"

  backend:
    needs: changes
    if: needs.changes.outputs.release_cut_only != 'true' && needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "25"
      # Only gradlew.bat (Windows) is checked into this repo, so CI provisions Gradle
      # directly via setup-gradle rather than using the wrapper — see CLAUDE.md's hard
      # rule on not adding a Unix wrapper script. gradle-version: wrapper reads the
      # version from gradle/wrapper/gradle-wrapper.properties (no wrapper script
      # required for that), so CI always matches the version local dev uses instead of
      # silently drifting to whatever's newest -- that drift is what caused CI-only
      # failures from a Gradle 9.4.1 (local) vs 9.7.0 (CI) validation behavior change.
      - uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: wrapper
      - name: Check
        working-directory: backend
        # Runs tests, the JaCoCo coverage gate, and SpotBugs static analysis
        # (all wired into `check` — see tooling_spec_001_code_quality_security.md).
        run: gradle check
      - name: Build
        working-directory: backend
        run: gradle build -x test

  frontend:
    needs: changes
    if: needs.changes.outputs.release_cut_only != 'true' && needs.changes.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install
        working-directory: frontend
        run: npm ci
      - name: Lint
        working-directory: frontend
        run: npm run lint
      - name: Format check
        working-directory: frontend
        run: npm run format:check
      - name: Test
        working-directory: frontend
        run: npm test
      - name: Build
        working-directory: frontend
        run: npm run build
      - name: Audit
        working-directory: frontend
        run: npm audit --audit-level=high

  # Enforces CLAUDE.md's Git workflow rule: a CHANGELOG.md entry landing under
  # [Unreleased] and cutting that content into a dated version are two
  # separate steps, and the second one must happen by the time anything
  # reaches main. Runs on push-to-main only (not pull_request) -- a feature
  # branch legitimately carries its own [Unreleased] entry mid-review, and
  # only fails once that content has actually landed without being cut.
  # Exists because narrative instructions alone let this slip twice
  # (2026-08-25, 16 PRs; 2026-09-01, 3 PRs) before this job was added.
  changelog-cut:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Verify CHANGELOG.md's Unreleased section is empty
        run: |
          content=$(awk '/^## \[Unreleased\]/{flag=1; next} /^## \[/{flag=0} flag' CHANGELOG.md | sed '/^[[:space:]]*$/d')
          if [ -n "$content" ]; then
            echo "::error::CHANGELOG.md's [Unreleased] section is non-empty on main -- this merge should have cut it into a dated ## [x.y.z] - YYYY-MM-DD section and bumped backend/build.gradle.kts + frontend/package.json to match. See CLAUDE.md's Git workflow section (\"release hygiene\")."
            echo "$content"
            exit 1
          fi
          echo "OK: [Unreleased] is empty."

  secrets-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      # Scanning the full checkout directly (rather than gitleaks/gitleaks-action, which
      # diffs the push event's before/after commit range) sidesteps that action erroring
      # out on certain push shapes, e.g. a repo's first push to main.
      - name: Install gitleaks
        run: |
          curl -sSL https://github.com/gitleaks/gitleaks/releases/download/v8.24.3/gitleaks_8.24.3_linux_x64.tar.gz \
            | tar -xz gitleaks
      - name: Scan for secrets
        run: ./gitleaks detect --source . --redact -v
