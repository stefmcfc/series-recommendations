spring:
  datasource:
    # tooling_spec_010 (TOOLING-010-AC-01): busy_timeout so a connection contending for the file
    # lock (e.g. across the several distinct ApplicationContexts Spring keeps cached simultaneously
    # for this suite) waits/retries instead of failing instantly with SQLITE_BUSY; maximum-pool-size
    # capped to 1 since SQLite only ever services one writer at a time regardless of pool size.
    url: jdbc:sqlite:./build/test-series.db?busy_timeout=30000
    driver-class-name: org.sqlite.JDBC
    hikari:
      maximum-pool-size: 1
  jpa:
    hibernate:
      ddl-auto: create-drop
    database-platform: org.hibernate.community.dialect.SQLiteDialect
    show-sql: false
  flyway:
    enabled: false
  http:
    clients:
      connect-timeout: 5s
      read-timeout: 10s

app:
  cors:
    allowed-origins: http://localhost:5173,http://127.0.0.1:5173
  omdb:
    base-url: https://www.omdbapi.com/
    # api-key intentionally left unset in the test profile -- see OmdbClientSpec /
    # SeriesControllerSpec for the "key not configured" 502 path.
  tmdb:
    base-url: https://api.themoviedb.org/3/
    # api-key intentionally left unset in the test profile -- see TmdbClientSpec /
    # SeriesControllerRecommendationsSpec for the "key not configured" 502 path.
    # series_spec_018: shorter than the 250ms production default so BulkRefreshService's
    # PollingConditions-based tests (SeriesControllerRefreshSpec) stay fast, while still
    # leaving a wide enough IN_PROGRESS window for the concurrent-start (409) test.
    refresh-delay-ms: 300
