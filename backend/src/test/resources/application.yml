spring:
  datasource:
    url: jdbc:sqlite:./build/test-series.db
    driver-class-name: org.sqlite.JDBC
  jpa:
    hibernate:
      ddl-auto: create-drop
    database-platform: org.hibernate.community.dialect.SQLiteDialect
    show-sql: false
  flyway:
    enabled: false
  http:
    clients:
      connect-timeout: 5s
      read-timeout: 10s

app:
  cors:
    allowed-origins: http://localhost:5173
  omdb:
    base-url: https://www.omdbapi.com/
    # api-key intentionally left unset in the test profile -- see OmdbClientSpec /
    # SeriesControllerSpec for the "key not configured" 502 path.
  tmdb:
    base-url: https://api.themoviedb.org/3/
    # api-key intentionally left unset in the test profile -- see TmdbClientSpec /
    # SeriesControllerRecommendationsSpec for the "key not configured" 502 path.
    # series_spec_018: shorter than the 250ms production default so BulkRefreshService's
    # PollingConditions-based tests (SeriesControllerRefreshSpec) stay fast, while still
    # leaving a wide enough IN_PROGRESS window for the concurrent-start (409) test.
    refresh-delay-ms: 300
