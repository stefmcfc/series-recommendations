spring:
  config:
    # Loads backend/application-local.yml if present (gitignored, outside src/ so it can
    # never end up compiled into a build artifact) -- lets a developer drop app.omdb.api-key/
    # app.tmdb.api-key into a local-only file instead of exporting env vars every session.
    # `optional:` means startup doesn't fail when the file is absent (e.g. in CI). See
    # backend/application-local.yml.example and RUNBOOK.md's Environment Variables section.
    import: "optional:file:./application-local.yml"
  datasource:
    url: jdbc:sqlite:./data/series.db
    driver-class-name: org.sqlite.JDBC
  jpa:
    hibernate:
      ddl-auto: validate
    database-platform: org.hibernate.community.dialect.SQLiteDialect
    show-sql: true
  flyway:
    enabled: true
    locations: classpath:db/migration
  # Bounded default connect/read timeouts for all outbound HTTP clients built from the
  # auto-configured RestClient.Builder (currently only OmdbClient) -- see SERIES-005-AC-08.
  # Deliberately not set via a manual ClientHttpRequestFactory inside OmdbClient itself:
  # doing so would call RestClient.Builder#requestFactory(...) a second time, silently
  # clobbering whatever MockRestServiceServer.bindTo(RestClient.Builder) had already wired
  # up for tests (both mutate the same builder property; last call wins). Configuring the
  # timeout at the Boot property level keeps OmdbClientSpec's mocked-server tests reliable.
  http:
    clients:
      connect-timeout: 5s
      read-timeout: 10s

app:
  cors:
    # Comma-separated list of origins allowed to call /api/** cross-origin (never a
    # wildcard). Override via the APP_CORS_ALLOWED_ORIGINS env var without a code change.
    # Includes both http://localhost:5173 and http://127.0.0.1:5173 -- vite.config.ts pins
    # the dev server to the 127.0.0.1 loopback explicitly (VPN/IPv6 compatibility, see
    # RUNBOOK.md), so the browser's Origin header is 127.0.0.1:5173 whenever a developer
    # accesses the app via that host (the default since that vite.config.ts change) or when
    # frontend/.env.local's VITE_API_BASE=/api/v1 workaround proxies calls through Vite --
    # the browser still attaches this Origin header to non-GET requests even though the
    # request is same-origin from its own perspective, and Vite forwards it to the backend
    # unchanged. Omitting either origin here silently breaks every PATCH/POST/DELETE request
    # made from that host with a real "Invalid CORS request" 403 -- confirmed as a live bug
    # this way on 2026-09-04 (RUNBOOK.md's Troubleshooting section has the full story).
    allowed-origins: http://localhost:5173,http://127.0.0.1:5173
  omdb:
    # Base URL for the OMDb API (https://www.omdbapi.com/). Overridable via the
    # APP_OMDB_BASE_URL env var without a code change (e.g. to point at a test double).
    base-url: https://www.omdbapi.com/
    # No default api-key here, intentionally -- it must be supplied via the APP_OMDB_API_KEY
    # env var. It is read via a constructor-injected @Value with an empty-string fallback
    # (see OmdbClient) so the app still starts and runs fine without it; only
    # GET /api/v1/series/lookup itself fails (502) until the key is configured. Never logged
    # or included in any response body.
  tmdb:
    # Base URL for the TMDB API (https://www.themoviedb.org/documentation/api). Overridable
    # via the APP_TMDB_BASE_URL env var without a code change (e.g. to point at a test double).
    base-url: https://api.themoviedb.org/3/
    # No default api-key here, intentionally -- it must be supplied via the APP_TMDB_API_KEY
    # env var. Read via a constructor-injected @Value with an empty-string fallback (see
    # TmdbClient), same pattern as app.omdb.api-key -- the app still starts and runs fine
    # without it; only GET /api/v1/series/recommendations fails (502) once it actually needs
    # to call TMDB (an empty "watched" pool short-circuits before any call is attempted, per
    # SERIES-006-AC-20, so a missing key alone doesn't fail the endpoint until there's
    # something to source recommendations from). Never logged or included in any response body.
    # SERIES-007-AC-01/02: configurable sourcing caps, replacing what were previously
    # hardcoded constants on RecommendationService. Overridable via APP_TMDB_MAX_SOURCE_SERIES
    # / APP_TMDB_MAX_CANDIDATES without a code change.
    max-source-series: 20
    max-candidates: 50
    # series_spec_029_configurable_min_vote_count_and_genre_floor.md (SERIES-029-AC-01/02/04):
    # default minimum-vote-count floor used both by RecommendationOutputFilterService's
    # post-hoc minVoteCount filter (for every sourceMode other than "topRated", which has its
    # own independent 200 constant) and by RecommendationSourcingService.sourceByGenreOrKeyword's
    # sourcing-time vote_count.gte floor sent to TMDB -- replacing the previously hardcoded
    # RecommendationDefaults.DEFAULT_MIN_VOTE_COUNT = 20. Overridable via
    # APP_TMDB_DEFAULT_MIN_VOTE_COUNT without a code change.
    default-min-vote-count: 200
    # SERIES-007-AC-22: RecommendationService's per-source diversity cap -- how many
    # recommendations can come from any single source series in "Specific Series" mode,
    # replacing what was previously a hardcoded constant. Overridable via
    # APP_TMDB_MAX_PER_SOURCE without a code change.
    max-per-source: 8
    # series_spec_018_series_refresh.md (SERIES-018-AC-15): fixed delay (milliseconds) between
    # items during a bulk refresh (POST /api/v1/series/refresh-all), sized to stay well under
    # TMDB's free-tier rate limit (~40 requests/10s) for a personal collection's realistic
    # size. A deliberately simple fixed-sleep mechanism, not a token/leaky-bucket
    # rate-limiter -- see the spec's Design Decisions. Overridable via
    # APP_TMDB_REFRESH_DELAY_MS without a code change.
    refresh-delay-ms: 250
    # series_spec_018_series_refresh.md (SERIES-018-AC-29/33/34): during a bulk refresh only,
    # a series whose lastRefreshedAt is within this many minutes of now is skipped rather than
    # re-fetched -- a repeat "Refresh All" click shouldn't burn TMDB rate-limit budget and
    # wall-clock time re-fetching data that's already current. Single-series refresh
    # (POST /series/{id}/refresh) never applies this threshold -- it always forces a real
    # refresh. A value of 0 disables skipping entirely (every series is refreshed on every
    # bulk run), the same "0 disables the filter" convention as app.tmdb's minVoteCount
    # (SERIES-007-AC-25). Overridable via APP_TMDB_REFRESH_SKIP_THRESHOLD_MINUTES without a
    # code change.
    refresh-skip-threshold-minutes: 60
    # series_spec_020_watch_providers.md (SERIES-020-AC-05): region consulted by
    # RecommendationService when resolving each recommendation candidate's currently-available
    # flatrate (subscription-streaming) watch providers via GET /tv/{tmdbId}/watch/providers --
    # a single configured value, not a per-request parameter (single-user personal app, one
    # household's viewing region). Overridable via APP_TMDB_WATCH_REGION without a code change.
    watch-region: GB
  recommendations:
    # SERIES-015-AC-14: selects RecommendationService's per-source diversity-cap strategy --
    # "best-source" (default) caps on each candidate's single best contributing source only;
    # "all-sources" caps on every contributing source. Any other value falls back to
    # "best-source" with no startup validation. Overridable via
    # APP_RECOMMENDATIONS_DIVERSITY_CAP_MODE without a code change.
    diversity-cap-mode: best-source