spring:
  datasource:
    url: jdbc:sqlite:./data/series.db
    driver-class-name: org.sqlite.JDBC
  jpa:
    hibernate:
      ddl-auto: validate
    database-platform: org.hibernate.community.dialect.SQLiteDialect
    show-sql: true
  flyway:
    enabled: true
    locations: classpath:db/migration

app:
  cors:
    # Comma-separated list of origins allowed to call /api/** cross-origin (never a
    # wildcard). Override via the APP_CORS_ALLOWED_ORIGINS env var without a code change.
    allowed-origins: http://localhost:5173