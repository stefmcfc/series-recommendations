server {
    # docker:S6471 -- 8080, not 80: running as the non-root nginx user (see frontend/Dockerfile)
    # can't bind a port below 1024 without an extra capability grant, so this pairs with that
    # fix rather than needing one of its own. docker-compose.yml's port mapping (still
    # host 4173 externally) is updated to match.
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # react-router-dom uses history-mode routing -- any path that doesn't match a real
    # static file falls back to index.html so client-side routing can take over (e.g. a
    # direct request/refresh on /settings).
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Same-origin API proxy: the browser only ever talks to this container's own origin,
    # so app.cors.allowed-origins on the backend never needs to change (tooling_spec_012
    # Decision 3). "backend" is the Compose service's DNS name on the Compose network.
    location /api/ {
        proxy_pass http://backend:8080/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
